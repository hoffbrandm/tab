# Publish the static Tab app to https://hoffbrandm.github.io/tab/
#
# If Settings → Pages is still "Deploy from a branch" (build_type: legacy),
# switch Source to GitHub Actions once. After that, push to main or
# Actions → Deploy GitHub Pages → Run workflow publishes current main.
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check the app
        run: npm test

      # The published file list is walked from index.html's entry module, not
      # written out here: a hand-written list went stale every time a module was
      # added, and the deployed app.js was left importing three files that were
      # never copied. stage-site.mjs fails the build if a module is missing, if
      # a published module imports something that was not published, or if a
      # test-only or server-only file reaches _site.
      - name: Stage public static files
        run: npm run stage

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
